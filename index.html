<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Expense Tracker</title>
    <link rel="stylesheet" href="extrack.css">
</head>

<body>

    <!--header-->

    <div class="bodyy">

        <div class="bodyheader">
            <div class="header">
                <a>
                    <h2>Expense Tracker</h2>
                </a>

                <a>
                    <button class="navbut" onclick="reset()">Reset</button>
                    <button class="navbut">Login</button>
                </a>
            </div>
        </div>

    </div>

    <!--dashboard-->

    <div class="dboard">

        <div class="dashboard">

            <div class="Total">
                <h3>Total balance</h3>
                <p id="balance">₹0</p>
            </div>

            <div class="Income">
                <h3>Total income</h3>
                <p id="income">₹0</p>
            </div>

            <div class="Expense">
                <h3>Total expense</h3>
                <p id="expense">₹0</p>
            </div>

            <div class="Saving">
                <h3>Total saving</h3>
                <p id="saving">₹0</p>
            </div>

        </div>
    </div>

    <!--actions-->

    <div class="actionbody" style="margin-top: 380px;">
        <div class="action">
            <div class="form">

                <div class="incomeform" id="incomeform">
                    <p class="formtitle">Title<button
                            style="width: 25px; height: 25px;border-radius: 5px; border: 1px black solid;background-color: black;color: green;margin-left: 320px;"
                            onclick="incomebtn()">X</button></p>
                    </p>
                    <input type="text" placeholder="Enter a income detile">

                    <p class="formtitle">Category</p>
                    <select name="" id="">
                        <option value="">select</option>
                        <option value="">food</option>
                        <option value="">trnspoart</option>
                        <option value="">invertsment</option>
                        <option value="">others</option>
                    </select>

                    <p class="formtitle">Time</p>
                    <input type="date">

                    <p class="formtitle">Amount</p>
                    <input type="number" placeholder="enter a amount" id="incomeamount">

                    <button class="formbtnI" onclick="addincome()">Add income</button>
                </div>


                <div class="expenseform" id="expenseform">
                    <p class="formtitle">Title <button
                            style="width: 25px; height: 25px;border-radius: 5px; border: 1px black solid;background-color: black;color: red; margin-left: 320px;"
                            onclick="expensebtn()">X</button></p>
                    <input type="text" placeholder="Enter a expense detile">

                    <p class="formtitle">Category</p>
                    <select name="" id="">
                        <option value="">select</option>
                        <option value="">food</option>
                        <option value="">trnspoart</option>
                        <option value="">invertsment</option>
                        <option value="">others</option>
                    </select>

                    <p class="formtitle">Time</p>
                    <input type="date">

                    <p class="formtitle">Amount</p>
                    <input type="number" placeholder="enter a amount" id="expeseamount">

                    <button class="formbtnE" onclick="addexpense()">Add expense</button>
                </div>


                <div class="saveform" id="saveform">

                    <p class="formtitle">Title <button
                            style="width: 25px; height: 25px;border-radius: 5px; border: 1px black solid;background-color: black;color: blue; margin-left: 320px;"
                            onclick="savebtn()">X</button></p>
                    <input type="number" placeholder="enter a amount" id="saveamount">

                    <button class="formbtnS" onclick="addsaving()">Save amount</button>
                </div>

            </div>
            <button class="actionbtnI" onclick="incomebtn()">Add income</button>
            <button class="actionbtnE" onclick="expensebtn()">Add expense</button>
            <button class="actionbtnS" onclick="savebtn()">Savings</button>
            <button class="actionbtnA">Analytics</button>
        </div>
    </div>


    <!--Transactions-->

    <div class="transaction">
        <div class="trans">
            <h2 style="padding-left: 20px;">Recent<br>Transactions</h2><br>
            <button class="tblbut">Add trasaction</button>
            <table>

                <tr>
                    <th>Title</th>
                    <th>Category</th>
                    <th>Date</th>
                    <th>Amount</th>
                </tr>

            </table>
        </div>
    </div>

    <script src="extrack.js"></script>













    <p style="margin-top: 1234px;">123456</p>
</body>

</html>
